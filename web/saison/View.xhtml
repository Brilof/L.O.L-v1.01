<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewSaisonTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewSaisonLabel_idSaison}"/>
                    <h:outputText value="#{saisonController.selected.idSaison}" title="#{bundle.ViewSaisonTitle_idSaison}"/>
                    <h:outputText value="#{bundle.ViewSaisonLabel_nomSaison}"/>
                    <h:outputText value="#{saisonController.selected.nomSaison}" title="#{bundle.ViewSaisonTitle_nomSaison}"/>
                    <h:outputText value="#{bundle.ViewSaisonLabel_statutSaison}"/>
                    <h:outputText value="#{saisonController.selected.statutSaison}" title="#{bundle.ViewSaisonTitle_statutSaison}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{saisonController.destroyAndView}" value="#{bundle.ViewSaisonDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewSaisonEditLink}"/>
                <br />
                <h:commandLink action="#{saisonController.prepareCreate}" value="#{bundle.ViewSaisonCreateLink}" />
                <br />
                <h:commandLink action="#{saisonController.prepareList}" value="#{bundle.ViewSaisonShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewSaisonIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
