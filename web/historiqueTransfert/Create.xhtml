<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateHistoriqueTransfertTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateHistoriqueTransfertLabel_idTransfert}" for="idTransfert" />
                    <h:inputText id="idTransfert" value="#{historiqueTransfertController.selected.idTransfert}" title="#{bundle.CreateHistoriqueTransfertTitle_idTransfert}" required="true" requiredMessage="#{bundle.CreateHistoriqueTransfertRequiredMessage_idTransfert}"/>
                    <h:outputLabel value="#{bundle.CreateHistoriqueTransfertLabel_dateTransfert}" for="dateTransfert" />
                    <h:inputText id="dateTransfert" value="#{historiqueTransfertController.selected.dateTransfert}" title="#{bundle.CreateHistoriqueTransfertTitle_dateTransfert}" required="true" requiredMessage="#{bundle.CreateHistoriqueTransfertRequiredMessage_dateTransfert}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.CreateHistoriqueTransfertLabel_idLastClub}" for="idLastClub" />
                    <h:selectOneMenu id="idLastClub" value="#{historiqueTransfertController.selected.idLastClub}" title="#{bundle.CreateHistoriqueTransfertTitle_idLastClub}" >
                        <f:selectItems value="#{equipesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateHistoriqueTransfertLabel_idNewClub}" for="idNewClub" />
                    <h:selectOneMenu id="idNewClub" value="#{historiqueTransfertController.selected.idNewClub}" title="#{bundle.CreateHistoriqueTransfertTitle_idNewClub}" >
                        <f:selectItems value="#{equipesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateHistoriqueTransfertLabel_idJoueur}" for="idJoueur" />
                    <h:selectOneMenu id="idJoueur" value="#{historiqueTransfertController.selected.idJoueur}" title="#{bundle.CreateHistoriqueTransfertTitle_idJoueur}" >
                        <f:selectItems value="#{joueursController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{historiqueTransfertController.create}" value="#{bundle.CreateHistoriqueTransfertSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{historiqueTransfertController.prepareList}" value="#{bundle.CreateHistoriqueTransfertShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateHistoriqueTransfertIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
