<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewClassementTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewClassementLabel_idEquipe}"/>
                    <h:outputText value="#{classementController.selected.idEquipe}" title="#{bundle.ViewClassementTitle_idEquipe}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_matchJoues}"/>
                    <h:outputText value="#{classementController.selected.matchJoues}" title="#{bundle.ViewClassementTitle_matchJoues}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_victoires}"/>
                    <h:outputText value="#{classementController.selected.victoires}" title="#{bundle.ViewClassementTitle_victoires}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_nulls}"/>
                    <h:outputText value="#{classementController.selected.nulls}" title="#{bundle.ViewClassementTitle_nulls}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_defaites}"/>
                    <h:outputText value="#{classementController.selected.defaites}" title="#{bundle.ViewClassementTitle_defaites}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_butsMarques}"/>
                    <h:outputText value="#{classementController.selected.butsMarques}" title="#{bundle.ViewClassementTitle_butsMarques}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_butsEncaisses}"/>
                    <h:outputText value="#{classementController.selected.butsEncaisses}" title="#{bundle.ViewClassementTitle_butsEncaisses}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_point}"/>
                    <h:outputText value="#{classementController.selected.point}" title="#{bundle.ViewClassementTitle_point}"/>
                    <h:outputText value="#{bundle.ViewClassementLabel_equipes}"/>
                    <h:outputText value="#{classementController.selected.equipes}" title="#{bundle.ViewClassementTitle_equipes}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{classementController.destroyAndView}" value="#{bundle.ViewClassementDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewClassementEditLink}"/>
                <br />
                <h:commandLink action="#{classementController.prepareCreate}" value="#{bundle.ViewClassementCreateLink}" />
                <br />
                <h:commandLink action="#{classementController.prepareList}" value="#{bundle.ViewClassementShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewClassementIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
