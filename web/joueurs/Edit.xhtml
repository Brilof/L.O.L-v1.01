<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditJoueursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditJoueursLabel_idJoueur}" for="idJoueur" />
                    <h:inputText id="idJoueur" value="#{joueursController.selected.idJoueur}" title="#{bundle.EditJoueursTitle_idJoueur}" required="true" requiredMessage="#{bundle.EditJoueursRequiredMessage_idJoueur}"/>
                    <h:outputLabel value="#{bundle.EditJoueursLabel_pseudo}" for="pseudo" />
                    <h:inputText id="pseudo" value="#{joueursController.selected.pseudo}" title="#{bundle.EditJoueursTitle_pseudo}" required="true" requiredMessage="#{bundle.EditJoueursRequiredMessage_pseudo}"/>
                    <h:outputLabel value="#{bundle.EditJoueursLabel_numero}" for="numero" />
                    <h:inputText id="numero" value="#{joueursController.selected.numero}" title="#{bundle.EditJoueursTitle_numero}" required="true" requiredMessage="#{bundle.EditJoueursRequiredMessage_numero}"/>
                    <h:outputLabel value="#{bundle.EditJoueursLabel_poste}" for="poste" />
                    <h:inputText id="poste" value="#{joueursController.selected.poste}" title="#{bundle.EditJoueursTitle_poste}" />
                    <h:outputLabel value="#{bundle.EditJoueursLabel_butMarques}" for="butMarques" />
                    <h:inputText id="butMarques" value="#{joueursController.selected.butMarques}" title="#{bundle.EditJoueursTitle_butMarques}" />
                    <h:outputLabel value="#{bundle.EditJoueursLabel_idEquipe}" for="idEquipe" />
                    <h:selectOneMenu id="idEquipe" value="#{joueursController.selected.idEquipe}" title="#{bundle.EditJoueursTitle_idEquipe}" >
                        <f:selectItems value="#{equipesController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{joueursController.update}" value="#{bundle.EditJoueursSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditJoueursViewLink}"/>
                <br />
                <h:commandLink action="#{joueursController.prepareList}" value="#{bundle.EditJoueursShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditJoueursIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
