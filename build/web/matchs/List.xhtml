<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <ui:composition template="/template.xhtml">
        <ui:define name="body">
            <h:form id="MatchsListForm">
                <p:outputPanel style="max-width: 800px; margin: 20px auto; padding: 0 10px;">
                    
                    <!-- EN-TÊTE DU CALENDRIER (Placé tout en haut pour être toujours rendu) -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eee;">
                        <h:outputText value="🏟️ Calendrier et Résultats - Ligue LOL" style="font-size:20px; font-weight:bold; color:#333;"/>
                        
                        <!-- Bouton de navigation HTML standard stylisé (évite les erreurs d'action Java) -->
                        <a href="#{request.contextPath}/faces/matchs/Create.xhtml" style="background:#1f70c1; color:white; font-weight:bold; border:none; padding: 10px 15px; border-radius: 4px; text-decoration: none; font-size: 14px; display: inline-block;">
                            ➕ Planifier un match
                        </a>
                    </div>

                    <!-- CAS A : SI LA LISTE EST VIDE -->
                    <h:panelGroup rendered="#{empty matchsController.allMatchsList}">
                        <div style="text-align: center; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); color: #888; border: 1px solid #eee;">
                            <i class="pi pi-calendar-times" style="font-size: 3rem; margin-bottom: 10px; color: #ccc; display: block;"></i>
                            Aucun match planifié pour le moment. Cliquez sur "Planifier un match" ci-dessus pour commencer.
                        </div>
                    </h:panelGroup>

                    <!-- CAS B : SI LA LISTE CONTIENT DES MATCHS -->
                    <h:panelGroup rendered="#{not empty matchsController.allMatchsList}">
                        <p:repeat value="#{matchsController.allMatchsList}" var="item">
                            
                            <!-- Sécurité absolue : On n'affiche la carte que si les équipes existent en BDD -->
                            <h:panelGroup rendered="#{item.idEquipeDomicile != null and item.idEquipeExterieur != null}">
                                <div style="background: white; margin-bottom: 12px; border-left: 5px solid #{item.statut == 'TERMINE' ? '#4CAF50' : '#FFC107'}; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-radius: 4px; padding: 15px; border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee;">
                                    
                                    <div class="ui-g" style="align-items: center; text-align: center; font-size: 16px;">
                                        
                                        <!-- Équipe Domicile -->
                                        <div class="ui-g-4" style="text-align: right; color:#333;">
                                            <h:outputText value="#{item.idEquipeDomicile.nom}" style="margin-right:10px; font-weight: bold;"/>
                                            <i class="pi pi-shield" style="color:#555; vertical-align: middle;"></i>
                                        </div>
                                        
                                        <!-- Score ou Date du Match -->
                                        <div class="ui-g-4" style="background: #f8f9fa; padding: 6px; border-radius: 4px;">
                                            <h:panelGroup rendered="#{item.statut == 'TERMINE'}">
                                                <h:outputText value="#{item.butsDomicile}" style="font-size:18px; font-weight:bold; color:#222;"/>
                                                <h:outputText value=" - " style="margin: 0 10px; color:#999; font-weight:bold;"/>
                                                <h:outputText value="#{item.butsExterieur}" style="font-size:18px; font-weight:bold; color:#222;"/>
                                            </h:panelGroup>
                                            
                                            <h:panelGroup rendered="#{item.statut != 'TERMINE'}">
                                                <h:outputText value="#{item.dateMatch}" style="font-size:11px; color:#666; display:block;">
                                                    <f:convertDateTime pattern="dd/MM/yyyy" />
                                                </h:outputText>
                                                <span style="font-size:12px; font-weight:bold; color:#ff9800;">VS</span>
                                            </h:panelGroup>
                                        </div>
                                        
                                        <!-- Équipe Extérieure -->
                                        <div class="ui-g-4" style="text-align: left; color:#333;">
                                            <i class="pi pi-shield" style="color:#555; vertical-align: middle; margin-right:10px;"></i>
                                            <h:outputText value="#{item.idEquipeExterieur.nom}" style="font-weight: bold;"/>
                                        </div>
                                        
                                    </div>
                                    
                                    <!-- Pied de carte avec boutons d'action d'origine NetBeans -->
                                    <div style="font-size:11px; color:#888; display: flex; justify-content: space-between; margin-top:10px; padding-top:8px; border-top:1px solid #f1f1f1;">
                                        <div><i class="pi pi-user" style="font-size:10px; margin-right:3px;"></i> Arbitre : #{item.arbitre}</div>
                                        <div>
                                            <h:commandLink action="#{matchsController.prepareEdit}" value="Saisir Score" style="color:#1f70c1; font-weight:bold; text-decoration:none; margin-right:15px;"/>
                                            <h:commandLink action="#{matchsController.destroy}" value="Supprimer" style="color:#f44336; text-decoration:none;"/>
                                        </div>
                                    </div>
                                    
                                </div>
                            </h:panelGroup>
                        </p:repeat>
                    </h:panelGroup>
                    
                </p:outputPanel>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
