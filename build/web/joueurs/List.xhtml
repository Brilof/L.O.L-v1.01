<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://w3.org">
<html xmlns="http://w3.org"
      xmlns:ui="http://jcp.org"
      xmlns:h="http://jcp.org"
      xmlns:f="http://jcp.org"
      xmlns:p="http://primefaces.org">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="Effectif des Joueurs"></h:outputText>
        </ui:define>
        
        <ui:define name="body">
            <h:form id="JoueursListForm">
                <p:outputPanel style="max-width: 850px; margin: 20px auto; padding: 0 10px;">
                    
                    <!-- En-tête -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h:outputText value="👥 Effectif des Joueurs - Ligue LOL" style="font-size:24px; font-weight:bold; color:#333;"/>
                        <p:commandButton action="#{joueursController.prepareCreate()}" value="Créer un joueur" icon="pi pi-plus" ajax="false" styleClass="ui-button-info" />
                    </div>

                    <!-- Si la liste est vide (Aucun joueur en BDD) -->
                    <h:panelGroup rendered="#{empty joueursController.allJoueursList}">
                        <div style="text-align: center; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); color: #888;">
                            <i class="pi pi-user-plus" style="font-size: 3rem; margin-bottom: 10px; color: #ccc; display: block;"></i>
                            Aucun joueur enregistré pour le moment. Cliquez sur "Créer un joueur" pour commencer.
                        </div>
                    </h:panelGroup>

                    <!-- Tableau Moderne style Google si la liste contient des éléments -->
                    <h:panelGroup rendered="#{not empty joueursController.allJoueursList}">
                        <p:dataTable value="#{joueursController.allJoueursList}" var="item" 
                                     paginator="true" rows="10" paginatorPosition="bottom"
                                     styleClass="ui-datatable-striped ui-datatable-sm">

                            <!-- Avatar Visuel (Première lettre du Pseudo) -->
                            <p:column style="width:50px; text-align:center;">
                                <div style="width: 32px; height: 32px; background: #e3f2fd; color: #1e88e5; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;">
                                    #{item.pseudo.substring(0,1).toUpperCase()}
                                </div>
                            </p:column>

                            <!-- Pseudo -->
                            <p:column headerText="Pseudo" sortBy="#{item.pseudo}" style="font-size:15px;">
                                <h:outputText value="#{item.pseudo}" />
                            </p:column>

                            <!-- Numéro de Maillot -->
                            <p:column headerText="Numéro" style="width:100px; text-align:center;">
                                <span style="background: #f1f3f4; padding: 4px 10px; border-radius: 4px; font-weight: bold; color: #5f6368;">
                                    N° #{item.numero}
                                </span>
                            </p:column>

                            <!-- Équipe actuelle (Vrai nom de votre clé étrangère dans l'entité) -->
                            <p:column headerText="Équipe" sortBy="#{item.idEquipeJoueur.nom}">
                                <h:panelGroup rendered="#{item.idEquipeJoueur != null}">
                                    <i class="pi pi-shield" style="margin-right:8px; color:#666; vertical-align: middle;"></i>
                                    <h:outputText value="#{item.idEquipeJoueur.nom}" style="vertical-align: middle;" />
                                </h:panelGroup>
                                <h:panelGroup rendered="#{item.idEquipeJoueur == null}">
                                    <span style="color:#b5b5b5; font-style:italic;">Sans club (Agent libre)</span>
                                </h:panelGroup>
                            </p:column>

                            <!-- Buts Marqués -->
                            <p:column headerText="⚽ Buts" sortBy="#{item.butsMarques}" style="width:90px; text-align:center; font-weight:bold; color:#2e7d32;">
                                <h:outputText value="#{item.butsMarques}" />
                            </p:column>

                        </p:dataTable>
                    </h:panelGroup>
                    
                </p:outputPanel>
            </h:form>
        </ui:define>
    </ui:composition>
</html>
