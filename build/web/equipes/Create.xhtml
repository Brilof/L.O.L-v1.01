<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateEquipesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_idEquipe}" for="idEquipe" />
                    <h:inputText id="idEquipe" value="#{equipesController.selected.idEquipe}" title="#{bundle.CreateEquipesTitle_idEquipe}" required="true" requiredMessage="#{bundle.CreateEquipesRequiredMessage_idEquipe}"/>
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{equipesController.selected.nom}" title="#{bundle.CreateEquipesTitle_nom}" required="true" requiredMessage="#{bundle.CreateEquipesRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_ville}" for="ville" />
                    <h:inputText id="ville" value="#{equipesController.selected.ville}" title="#{bundle.CreateEquipesTitle_ville}" required="true" requiredMessage="#{bundle.CreateEquipesRequiredMessage_ville}"/>
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_dateCreation}" for="dateCreation" />
                    <h:inputText id="dateCreation" value="#{equipesController.selected.dateCreation}" title="#{bundle.CreateEquipesTitle_dateCreation}" required="true" requiredMessage="#{bundle.CreateEquipesRequiredMessage_dateCreation}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_idCapitaine}" for="idCapitaine" />
                    <h:selectOneMenu id="idCapitaine" value="#{equipesController.selected.idCapitaine}" title="#{bundle.CreateEquipesTitle_idCapitaine}" >
                        <f:selectItems value="#{joueursController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateEquipesLabel_classement}" for="classement" />
                    <h:selectOneMenu id="classement" value="#{equipesController.selected.classement}" title="#{bundle.CreateEquipesTitle_classement}" >
                        <f:selectItems value="#{classementController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{equipesController.create}" value="#{bundle.CreateEquipesSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{equipesController.prepareList}" value="#{bundle.CreateEquipesShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateEquipesIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
