<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditEquipesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditEquipesLabel_idEquipe}" for="idEquipe" />
                    <h:inputText id="idEquipe" value="#{equipesController.selected.idEquipe}" title="#{bundle.EditEquipesTitle_idEquipe}" required="true" requiredMessage="#{bundle.EditEquipesRequiredMessage_idEquipe}"/>
                    <h:outputLabel value="#{bundle.EditEquipesLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{equipesController.selected.nom}" title="#{bundle.EditEquipesTitle_nom}" required="true" requiredMessage="#{bundle.EditEquipesRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.EditEquipesLabel_ville}" for="ville" />
                    <h:inputText id="ville" value="#{equipesController.selected.ville}" title="#{bundle.EditEquipesTitle_ville}" required="true" requiredMessage="#{bundle.EditEquipesRequiredMessage_ville}"/>
                    <h:outputLabel value="#{bundle.EditEquipesLabel_dateCreation}" for="dateCreation" />
                    <h:inputText id="dateCreation" value="#{equipesController.selected.dateCreation}" title="#{bundle.EditEquipesTitle_dateCreation}" required="true" requiredMessage="#{bundle.EditEquipesRequiredMessage_dateCreation}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditEquipesLabel_idCapitaine}" for="idCapitaine" />
                    <h:selectOneMenu id="idCapitaine" value="#{equipesController.selected.idCapitaine}" title="#{bundle.EditEquipesTitle_idCapitaine}" >
                        <f:selectItems value="#{joueursController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.EditEquipesLabel_classement}" for="classement" />
                    <h:selectOneMenu id="classement" value="#{equipesController.selected.classement}" title="#{bundle.EditEquipesTitle_classement}" >
                        <f:selectItems value="#{classementController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{equipesController.update}" value="#{bundle.EditEquipesSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditEquipesViewLink}"/>
                <br />
                <h:commandLink action="#{equipesController.prepareList}" value="#{bundle.EditEquipesShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditEquipesIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
