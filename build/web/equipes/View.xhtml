<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewEquipesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewEquipesLabel_idEquipe}"/>
                    <h:outputText value="#{equipesController.selected.idEquipe}" title="#{bundle.ViewEquipesTitle_idEquipe}"/>
                    <h:outputText value="#{bundle.ViewEquipesLabel_nom}"/>
                    <h:outputText value="#{equipesController.selected.nom}" title="#{bundle.ViewEquipesTitle_nom}"/>
                    <h:outputText value="#{bundle.ViewEquipesLabel_ville}"/>
                    <h:outputText value="#{equipesController.selected.ville}" title="#{bundle.ViewEquipesTitle_ville}"/>
                    <h:outputText value="#{bundle.ViewEquipesLabel_dateCreation}"/>
                    <h:outputText value="#{equipesController.selected.dateCreation}" title="#{bundle.ViewEquipesTitle_dateCreation}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:outputText>
                    <h:outputText value="#{bundle.ViewEquipesLabel_idCapitaine}"/>
                    <h:outputText value="#{equipesController.selected.idCapitaine}" title="#{bundle.ViewEquipesTitle_idCapitaine}"/>
                    <h:outputText value="#{bundle.ViewEquipesLabel_classement}"/>
                    <h:outputText value="#{equipesController.selected.classement}" title="#{bundle.ViewEquipesTitle_classement}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{equipesController.destroyAndView}" value="#{bundle.ViewEquipesDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewEquipesEditLink}"/>
                <br />
                <h:commandLink action="#{equipesController.prepareCreate}" value="#{bundle.ViewEquipesCreateLink}" />
                <br />
                <h:commandLink action="#{equipesController.prepareList}" value="#{bundle.ViewEquipesShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewEquipesIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
