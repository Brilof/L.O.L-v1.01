<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditSaisonTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditSaisonLabel_idSaison}" for="idSaison" />
                    <h:inputText id="idSaison" value="#{saisonController.selected.idSaison}" title="#{bundle.EditSaisonTitle_idSaison}" required="true" requiredMessage="#{bundle.EditSaisonRequiredMessage_idSaison}"/>
                    <h:outputLabel value="#{bundle.EditSaisonLabel_nomSaison}" for="nomSaison" />
                    <h:inputText id="nomSaison" value="#{saisonController.selected.nomSaison}" title="#{bundle.EditSaisonTitle_nomSaison}" required="true" requiredMessage="#{bundle.EditSaisonRequiredMessage_nomSaison}"/>
                    <h:outputLabel value="#{bundle.EditSaisonLabel_statutSaison}" for="statutSaison" />
                    <h:inputText id="statutSaison" value="#{saisonController.selected.statutSaison}" title="#{bundle.EditSaisonTitle_statutSaison}" />
                </h:panelGrid>
                <h:commandLink action="#{saisonController.update}" value="#{bundle.EditSaisonSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditSaisonViewLink}"/>
                <br />
                <h:commandLink action="#{saisonController.prepareList}" value="#{bundle.EditSaisonShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditSaisonIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
